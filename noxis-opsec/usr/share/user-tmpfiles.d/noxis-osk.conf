# Noxis: Tastatur-Daten nur im RAM (%t = /run/user/UID, tmpfs)
d  %t/noxis-osk                0700 - - -
d  %t/noxis-osk/squeekboard    0700 - - -
d  %t/noxis-osk/presage        0700 - - -
L+ %C/squeekboard              - - - - %t/noxis-osk/squeekboard
L+ %S/squeekboard              - - - - %t/noxis-osk/squeekboard
L+ %h/.presage                 - - - - %t/noxis-osk/presage
