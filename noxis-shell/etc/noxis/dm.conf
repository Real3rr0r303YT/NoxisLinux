[dm]
# virtual console for greeter and session
vt = 1
# greeter system user (no shell, no password)
greeter_user = noxis-greeter
# greeter command (cage = kiosk compositor, -m last = on the external display if present)
greeter_cmd = cage -s -m last -- /usr/lib/noxis/greeter/noxis-greeter
# PAM services: /etc/pam.d/noxis (login), /etc/pam.d/noxis-greeter (greeter session)
pam_service = noxis
greeter_pam_service = noxis-greeter
# allowed session commands (file name), comma-separated
sessions = phosh-session
# wlroots renderer: pixman (software) or gles2 (hardware). Mesa has no GL
# driver for Qualcomm's KGSL, so gles2 fails with "DRI2: failed to load driver"
# on this kernel.
renderer = pixman
