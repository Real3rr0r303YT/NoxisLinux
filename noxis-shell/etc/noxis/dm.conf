[dm]
# virtuelle Konsole für Greeter und Sitzung
vt = 1
# Systemnutzer des Greeters (ohne Shell, ohne Passwort)
greeter_user = noxis-greeter
# Greeter-Befehl (cage = Kiosk-Compositor, -m last = auf externem Bildschirm, falls vorhanden)
greeter_cmd = cage -s -m last -- /usr/lib/noxis/greeter/noxis-greeter
# PAM-Dienste: /etc/pam.d/noxis (Anmeldung), /etc/pam.d/noxis-greeter (Greeter-Sitzung)
pam_service = noxis
greeter_pam_service = noxis-greeter
# erlaubte Sitzungsbefehle (Dateiname), Komma-getrennt
sessions = phosh-session
