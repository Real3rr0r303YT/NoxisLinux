#
# Startet ModemManager sofort, verliert er in den ersten Sekunden dreimal
# hintereinander die QRTR-Verbindung ("Cannot read from istream: connection
# broken", "port 'qrtr0' no longer controllable, reprobing") und legt das
# Modem jedes Mal neu an: Modem/0, /1, /2, erst /3 bleibt. Die Oberflaeche
# fragt die SIM-PIN dann fuer ein Modem ab, das es schon nicht mehr gibt.
# Darum erst starten, wenn das Modem hochgefahren ist und sich gesetzt hat.
[Unit]
After=noxis-radios.service rmtfs.service
Wants=noxis-radios.service

[Service]
ExecStartPre=/bin/sleep 15
