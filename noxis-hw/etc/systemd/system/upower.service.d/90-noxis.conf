#
# Der Noxis-Kernel hat CONFIG_USER_NS=n (weniger Angriffsflaeche).
# upower.service will PrivateUsers=yes und bricht dann mit
# "Failed to set up user namespacing" (status=217/USER) ab --
# ohne upowerd zeigt Phosh keinen Akku an.
[Service]
PrivateUsers=no
