#
# pd-mapper liest die .jsn-Dateien aus /lib/firmware -- die Links legt
# noxis-firmware-links an, also erst danach starten; vor dem Modem-Start.
[Unit]
After=noxis-firmware-links.service
Before=noxis-radios.service

[Service]
# Der Android-Bootloader setzt firmware_class.path auf eine Komma-Liste
# (/vendor/firmware_mnt/image,/vendor/vm-system/...,/vendor/firmware).
# pd-mapper nimmt den Wert als EINEN Ordner, findet dort nichts und meldet
# "no pd maps available". Alle Firmware ist nach /lib/firmware verlinkt
# (noxis-firmware-links), also zeigt der Pfad jetzt dorthin. Der Kernel
# sucht ohnehin zusaetzlich in /lib/firmware.
# Nur kurz: der Originalwert wird gesichert und 3 s nach dem Start von
# pd-mapper (das den Wert nur beim Start liest) wiederhergestellt.
ExecStartPre=/bin/sh -c 'P=/sys/module/firmware_class/parameters/path; [ -f /run/noxis-fwpath ] || cat $P > /run/noxis-fwpath; printf %%s /lib/firmware > $P'
ExecStartPost=/bin/sh -c 'sleep 3; [ -s /run/noxis-fwpath ] && printf %%s "$(cat /run/noxis-fwpath)" > /sys/module/firmware_class/parameters/path || true'
Restart=on-failure
RestartSec=3
