# https://github.com/Real3rr0r303YT/NoxisLinux
#
# Debian startet "rmtfs -r -P -s". Mit -r will rmtfs das Modem selbst ueber
# /dev/remoteprocN steuern und sucht dafuer einen Remoteproc namens "modem" --
# im Android-Kernel heisst er "4080000.remoteproc-mss", also bricht rmtfs mit
# "Failed to get rprocfd" ab. Ohne Modem-Speicher (EFS) laeuft das Modem
# nicht richtig, und ohne Modem bekommt WLAN keine MAC-Adresse.
# Das Modem startet hier noxis-radios, rmtfs liefert nur den Speicher.
[Unit]
Before=noxis-radios.service

[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -P -s -v
Restart=always
RestartSec=2
