#
# Debian startet "rmtfs -r -P -s". -s will das Modem ueber seine
# Remoteproc-"state"-Datei mitsteuern und erkennt es nur an "-mpss-pas" oder
# "-mss-pil" im modalias. Der Android-Kernel meldet das Modem anders, also
# bricht rmtfs mit "Failed to get rprocfd" ab. Ohne rmtfs fehlt dem Modem
# sein EFS-Speicher, und ohne Modem bekommt WLAN keine MAC-Adresse.
# Das Modem startet hier noxis-radios; rmtfs liefert nur den Speicher
# (-P: Partitionen modemst1/modemst2/fsg/fsc, ohne -r: beschreibbar).
[Unit]
After=systemd-udev-settle.service systemd-udev-trigger.service
Before=noxis-radios.service

[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -P -v
Restart=always
RestartSec=2
