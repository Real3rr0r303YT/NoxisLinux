# Noxis: Powertaste auf einem Telefon
#
# systemd schaltet bei einem kurzen Druck standardmaessig aus
# (HandlePowerKey=poweroff). Auf einem Geraet ohne zweiten Knopf zum
# Bildschirmsperren ist das falsch: man tippt die Taste an und das Telefon
# geht aus, mitten in der Arbeit.
#
# ignore ueberlaesst den kurzen Druck der Oberflaeche, die den Bildschirm
# ausschaltet. Langes Druecken schaltet weiterhin aus, das ist der Weg, den
# jeder erwartet. Der Hardware-Reset durch sehr langes Halten bleibt davon
# ohnehin unberuehrt, den macht der Chip selbst.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
IdleAction=ignore
